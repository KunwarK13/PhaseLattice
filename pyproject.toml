[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phaselattice"
version = "0.1.0"
description = "Reconstruct periodic response models with selected phase-list lattice decoding"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "PhaseLattice contributors"}]
keywords = ["inverse-problems", "lattice-reduction", "model-reconstruction", "quantum-machine-learning"]
dependencies = ["numpy>=2.2,<3", "mpmath>=1.3,<2", "sympy>=1.13,<2", "fpylll>=0.6.4,<0.7", "cysignals>=1.12,<2"]

[project.optional-dependencies]
torch = ["torch>=2.5,<3"]
quantum = ["qiskit>=2.3,<3"]
research = ["torch>=2.5,<3", "qiskit>=2.3,<3", "matplotlib>=3.10,<4", "scipy>=1.15,<2"]
dev = ["pytest>=8,<10", "ruff>=0.12", "build>=1.2", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
phaselattice = "phaselattice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phaselattice = ["resources/*.json", "templates/*.tmpl", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["evidence", "runs", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/phaselattice/algebra.py" = ["E741"]
